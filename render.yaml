# Render Blueprint — backend web service only.
# The database is on Supabase (created via Vercel), so Render does NOT
# provision a DB — DATABASE_URL is set manually (see below).
#
# This repo's root IS the backend (package.json at the top level), so there is
# no `rootDir` — build/start run at the repository root.

services:
  - type: web
    name: weightcalc-api
    runtime: node
    plan: free
    region: frankfurt # pick the region closest to your users
    healthCheckPath: /health
    # NODE_ENV=production makes npm skip devDeps, but we need tsc/prisma/tsx
    # to build + run migrations, so force them in with --include=dev.
    buildCommand: npm ci --include=dev && npm run prisma:generate && npm run build
    # Apply pending migrations on every deploy, then boot.
    startCommand: npm run prisma:deploy && npm run start
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: '22' # argon2 ships prebuilt binaries for Node 22
      # Supabase Session-pooler URI (port 5432 on the *.pooler.supabase.com host),
      # with ?sslmode=require appended. Set this in the dashboard.
      - key: DATABASE_URL
        sync: false
      # 32+ char secrets, generated and stored by Render.
      - key: JWT_ACCESS_SECRET
        generateValue: true
      - key: JWT_REFRESH_SECRET
        generateValue: true
      - key: JWT_INITIATION_SECRET
        generateValue: true
      # Secrets you must set manually in the dashboard:
      - key: RESEND_API_KEY
        sync: false
      - key: EMAIL_FROM
        sync: false
      # Groq key for AI food parsing + recommendations (console.groq.com/keys)
      - key: GROQ_API_KEY
        sync: false
      # Your Vercel origin, e.g. https://weightcalc.vercel.app
      - key: CORS_ORIGIN
        sync: false
